name: Tracefold CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracefold-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python quality gates
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Lint Python
        run: python -m ruff check backend scripts tests
      - name: Check Python formatting
        run: python -m ruff format --check backend scripts tests
      - name: Test backend with coverage
        env:
          TRACEFOLD_RUNTIME: fake
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Audit production dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run unit tests
        run: npm --prefix frontend run test
      - name: Build production bundle
        run: npm --prefix frontend run build
      - name: Install browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser tests
        run: npm --prefix frontend run test:e2e
