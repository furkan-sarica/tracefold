name: Tracefold CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracefold-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python quality gates
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
            requirements-dev-lock.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Audit locked development dependencies
        run: python -m pip_audit --require-hashes --disable-pip --strict --progress-spinner off -r requirements-dev-lock.txt
      - name: Lint Python
        run: python -m ruff check backend scripts tests
      - name: Check Python formatting
        run: python -m ruff format --check backend scripts tests
      - name: Test backend with coverage
        env:
          TRACEFOLD_RUNTIME: fake
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=75
      - name: Verify final release artifacts
        run: make release-artifacts PYTHON=python

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Audit all frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run unit tests
        run: npm --prefix frontend run test
      - name: Build production bundle
        run: npm --prefix frontend run build
      - name: Install browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser tests
        run: npm --prefix frontend run test:e2e
